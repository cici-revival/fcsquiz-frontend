# Для WebSocket заголовок Connection должен быть "upgrade", а для обычных
# запросов — пустым, иначе они пойдут с висящим Upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://${GATEWAY_HOST}:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Рассадка ходит по WebSocket (/v1/adminka/seating/ws). Без этих трёх
        # строк nginx проксирует по HTTP/1.0 и не передаёт Upgrade — рукопожатие
        # не доходит до гейтвея, и браузер показывает "WebSocket failed".
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # Хешированные ассеты (js/css/шрифты): имя меняется при каждой сборке,
    # поэтому содержимое можно кэшировать навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Рантайм-конфиг: НИКОГДА не кэшировать. Меняется при передеплое без смены
    # имени файла — закэшированный env.js означает, что фронт будет стучаться
    # по старому API_BASE_URL.
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # index.html ревалидируется всегда: он ссылается на хешированные ассеты,
    # и устаревшая копия отправила бы браузер за чанками, которых уже нет.
    # Именно no-cache, а не no-store: копия хранится, но проверяется через
    # ETag и обычно возвращает 304 без тела.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        expires -1;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
